services:
  # Stores data for product-service and order-service (separate databases).
  postgres:
    image: postgres:17
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Keeps data between restarts.
      - postgres-data:/var/lib/postgresql/data
      # Files in this folder run automatically on first startup.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Message broker: order-service publishes events, notification-service consumes them.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecom-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # app connections
      - "15672:15672"   # management UI

  # Used for caching (product-service) and rate limiting (api-gateway).
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      - "6379:6379"

  # Fake SMTP server: catches emails locally so nothing real is ever sent.
  mailpit:
    image: axllent/mailpit
    container_name: ecom-mailpit
    ports:
      - "1025:1025"   # SMTP (what our app sends to)
      - "8025:8025"   # web inbox to view emails

volumes:
  postgres-data: